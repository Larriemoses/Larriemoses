<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Olarewaju Adebulu — AI Software Engineer and Writer</title>
  <desc id="desc">A dark portfolio banner with animated AI agent orbits and role badges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B14"/>
      <stop offset="0.5" stop-color="#10172A"/>
      <stop offset="1" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="brand" x1="118" y1="70" x2="620" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;180;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop stop-color="#0891B2" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8B9CB7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="30" fill="url(#bg)" stroke="#27324A" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="418" rx="30" fill="url(#grid)"/>

  <circle cx="930" cy="80" r="240" fill="url(#glowA)" filter="url(#softBlur)">
    <animate attributeName="r" values="220;255;220" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="340" r="190" fill="url(#glowB)" filter="url(#softBlur)">
    <animate attributeName="r" values="170;205;170" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(58 38)">
    <rect width="202" height="34" rx="17" fill="#101827" stroke="#30415E"/>
    <circle cx="20" cy="17" r="5.5" fill="#34D399" filter="url(#nodeGlow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5.5;7;5.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="22" fill="#D8E3F5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">OPEN TO COLLABORATE</text>
  </g>

  <g transform="translate(60 107)">
    <text x="0" y="0" fill="#8FA3C2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">HELLO, I'M</text>
    <text x="0" y="67" fill="url(#brand)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">OLAREWAJU</text>
    <text x="0" y="123" fill="#F4F7FB" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="5">ADEBULU</text>
    <text x="2" y="162" fill="#A8B6CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">I research, build, and explain intelligent software.</text>

    <g transform="translate(0 194)">
      <rect width="187" height="39" rx="19.5" fill="#16243A" stroke="#2F6DA9"/>
      <text x="93.5" y="25" text-anchor="middle" fill="#7CC2FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">AI ENGINEERING</text>
      <rect x="199" width="183" height="39" rx="19.5" fill="#221A3A" stroke="#6642A8"/>
      <text x="290.5" y="25" text-anchor="middle" fill="#BCA5FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">LLM RESEARCH</text>
      <rect x="394" width="194" height="39" rx="19.5" fill="#102D33" stroke="#187B89"/>
      <text x="491" y="25" text-anchor="middle" fill="#72E7F4" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">TECHNICAL WRITING</text>
    </g>

    <text x="0" y="286" fill="#71839F" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" letter-spacing="1.2">NIGERIA  •  BUILDING FOR THE WORLD</text>
  </g>

  <g transform="translate(935 210)">
    <circle r="123" fill="none" stroke="#536D9A" stroke-opacity="0.42" stroke-width="1.2" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="86" fill="none" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.3" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="17s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#5FA8E8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 7">
      <path d="M0 -62 L-104 -66">
        <animate attributeName="stroke-dashoffset" values="0;-36" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <path d="M55 27 L105 70">
        <animate attributeName="stroke-dashoffset" values="0;-36" dur="3.1s" repeatCount="indefinite"/>
      </path>
      <path d="M-53 30 L-87 87">
        <animate attributeName="stroke-dashoffset" values="0;-36" dur="4.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <g>
      <circle r="61" fill="#111B31" stroke="url(#brand)" stroke-width="2.5"/>
      <circle r="49" fill="#0C1425" stroke="#314262"/>
      <path d="M-23 13 L-6 -26 H8 L27 13 M-17 0 H20" stroke="#7CC2FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-17 24 H17" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="68" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3">
        <animate attributeName="r" values="65;75;65" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(-112 -66)">
      <circle r="30" fill="#14213A" stroke="#3B82B9"/>
      <path d="M-11 -8 L-19 0 L-11 8 M11 -8 L19 0 L11 8 M4 -14 L-4 14" stroke="#7CC2FF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -7;0 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(112 73)">
      <circle r="30" fill="#1D1733" stroke="#7651B7"/>
      <path d="M-10 -11 H10 V11 H-10 Z M-5 -5 H5 M-5 1 H5 M-5 7 H2" stroke="#C4B5FD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 7;0 0" dur="4.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(-92 94)">
      <circle r="30" fill="#0E2930" stroke="#168397"/>
      <circle cx="-8" cy="-3" r="4" fill="#67E8F9"/>
      <circle cx="9" cy="-10" r="4" fill="#67E8F9"/>
      <circle cx="10" cy="10" r="4" fill="#67E8F9"/>
      <path d="M-4 -5 L5 -8 M-5 0 L6 7" stroke="#67E8F9" stroke-width="2.4"/>
      <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;-5 4;0 0" dur="5.2s" repeatCount="indefinite"/>
    </g>

    <g fill="#8FB8EA" filter="url(#nodeGlow)">
      <circle cx="0" cy="-123" r="4">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="123" cy="0" r="4">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="123" r="4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
