<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Olarewaju's three areas of focus</title>
  <desc id="desc">Three illustrated cards for AI software engineering, technical writing, and AI and LLM research writing.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="320">
      <stop stop-color="#0C111D"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="26" fill="url(#panel)" stroke="#27324A" stroke-width="2"/>

  <g transform="translate(28 26)">
    <rect width="364" height="268" rx="21" fill="#101827" stroke="#283851"/>
    <rect x="1" y="1" width="362" height="4" rx="2" fill="url(#blue)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="58" cy="64" r="31" fill="#122844" stroke="#326BA3"/>
    <path d="M48 54 L39 64 L48 74 M68 54 L77 64 L68 74 M62 47 L54 81" stroke="#7CC2FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="64" r="38" fill="none" stroke="#58A6FF" stroke-opacity="0.35">
      <animate attributeName="r" values="35;42;35" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0;0.45" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="124" fill="#F3F6FB" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="700">AI Software Engineering</text>
    <text x="28" y="161" fill="#AAB8CD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">
      <tspan x="28" dy="0">Agentic workflows, LLM integrations,</tspan>
      <tspan x="28" dy="25">voice interfaces, APIs, and thoughtful</tspan>
      <tspan x="28" dy="25">web and mobile products.</tspan>
    </text>
    <text x="28" y="244" fill="#69B5FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">RESEARCH → ARCHITECT → SHIP</text>
  </g>

  <g transform="translate(418 26)">
    <rect width="364" height="268" rx="21" fill="#111725" stroke="#342B50"/>
    <rect x="1" y="1" width="362" height="4" rx="2" fill="url(#violet)">
      <animate attributeName="opacity" values="1;0.55;1" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="58" cy="64" r="31" fill="#241B3A" stroke="#6D4BA7"/>
    <path d="M46 79 L49 66 L66 49 C69 46 74 51 71 54 L54 71 L46 79Z" stroke="#C4B5FD" stroke-width="2.7" stroke-linejoin="round"/>
    <path d="M50 65 L56 71 M65 51 L71 57 M44 81 H72" stroke="#C4B5FD" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="71" cy="50" r="4" fill="#A78BFA" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="124" fill="#F3F6FB" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="700">Technical Writing</text>
    <text x="28" y="161" fill="#AAB8CD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">
      <tspan x="28" dy="0">Documentation, tutorials, product stories,</tspan>
      <tspan x="28" dy="25">and developer education that make complex</tspan>
      <tspan x="28" dy="25">systems clear and useful.</tspan>
    </text>
    <text x="28" y="244" fill="#BCA5FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">UNDERSTAND → DISTILL → EXPLAIN</text>
  </g>

  <g transform="translate(808 26)">
    <rect width="364" height="268" rx="21" fill="#0E1922" stroke="#1D4650"/>
    <rect x="1" y="1" width="362" height="4" rx="2" fill="url(#cyan)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.1s" repeatCount="indefinite"/>
    </rect>
    <circle cx="58" cy="64" r="31" fill="#102C34" stroke="#197A8B"/>
    <circle cx="46" cy="59" r="5" fill="#67E8F9"/>
    <circle cx="68" cy="50" r="5" fill="#67E8F9"/>
    <circle cx="72" cy="73" r="5" fill="#67E8F9"/>
    <circle cx="48" cy="77" r="5" fill="#67E8F9"/>
    <path d="M50 57 L64 52 M69 55 L71 68 M67 74 L53 77 M47 72 L46 64 M51 62 L66 70" stroke="#67E8F9" stroke-width="2.3"/>
    <circle cx="58" cy="64" r="39" fill="none" stroke="#22D3EE" stroke-opacity="0.25">
      <animate attributeName="r" values="36;43;36" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="124" fill="#F3F6FB" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="700">AI &amp; LLM Research Writing</text>
    <text x="28" y="161" fill="#AAB8CD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">
      <tspan x="28" dy="0">Model behavior, evaluation, product impact,</tspan>
      <tspan x="28" dy="25">human oversight, and grounded analysis of</tspan>
      <tspan x="28" dy="25">how intelligent systems work in practice.</tspan>
    </text>
    <text x="28" y="244" fill="#67E8F9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">QUESTION → EVALUATE → PUBLISH</text>
  </g>
</svg>
